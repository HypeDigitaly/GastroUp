<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stránka nenalezena — GastroUp</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #06264C;
      color: #EFE3D3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 6rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #CC972D;
    }
    p {
      font-size: 1.25rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 32px;
      background: #CC972D;
      color: #06264C;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s ease;
    }
    a:hover {
      background: #E5AE3D;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Promiň, stránku jsme nenašli.</p>
    <p>Možná byla přesunuta nebo smazána. Vrať se na hlavní stránku a pokračuj v procházení.</p>
    <a href="/">← Zpět na úvodní stránku</a>
  </div>
</body>
</html>
