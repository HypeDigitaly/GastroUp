<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stránka nenalezena — GastroUp</title>
  <!-- @include components/analytics.html -->
  <style>
    :root {
      --navy: #06264C;
      --cream: #EFE3D3;
      --gold: #CC972D;
      --gold-bright: #E5AE3D;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #06264C;
      color: #EFE3D3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      text-align: center;
      max-width: 600px;
    }
    h1 {
      font-size: 6rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #CC972D;
    }
    p {
      font-size: 1.25rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 12px 32px;
      background: #CC972D;
      color: #06264C;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.3s ease;
    }
    a:hover {
      background: #E5AE3D;
    }
    /* GP COOKIE BANNER */
    #gp-cookie-banner{display:none;position:fixed;bottom:0;left:0;right:0;z-index:65;background:var(--navy);color:var(--cream);padding:16px 24px;box-shadow:0 -4px 24px -8px rgba(3,21,46,.45);border-top:1px solid rgba(255,255,255,.08)}
    #gp-cookie-banner.gp-cb-visible{display:block}
    .gp-cb-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
    .gp-cb-text{flex:1;min-width:220px;font-size:13.5px;line-height:1.55;color:var(--cream)}
    .gp-cb-text a{color:var(--gold-bright);text-decoration:underline;text-underline-offset:2px}
    .gp-cb-text a:hover{color:var(--gold)}
    .gp-cb-actions{display:flex;gap:10px;flex-shrink:0;flex-wrap:wrap}
    .gp-cb-accept,.gp-cb-decline{font-family:var(--font-sans);font-size:14px;font-weight:600;padding:10px 22px;border-radius:9px;cursor:pointer;border:2px solid transparent;transition:opacity .18s,transform .18s}
    .gp-cb-accept:focus-visible,.gp-cb-decline:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
    .gp-cb-accept{background:var(--gold);color:var(--navy);border-color:var(--gold)}
    .gp-cb-accept:hover{opacity:.88;transform:translateY(-1px)}
    .gp-cb-decline{background:transparent;color:var(--cream);border-color:rgba(239,227,211,.6)}
    .gp-cb-decline:hover{border-color:var(--cream);opacity:.88;transform:translateY(-1px)}
    @media (prefers-reduced-motion:reduce){.gp-cb-accept,.gp-cb-decline{transition:none}}
    @media (max-width:600px){.gp-cb-inner{flex-direction:column;align-items:stretch;gap:12px}.gp-cb-actions{flex-direction:column}.gp-cb-accept,.gp-cb-decline{text-align:center}}
    .cookie-settings-wrap{margin-top:16px;font-size:13px}
    .cookie-settings-wrap a.gp-cookie-settings{display:inline;padding:0;background:none;color:rgba(239,227,211,.82);border-radius:0;font-weight:400;text-decoration:underline;text-underline-offset:3px}
    /* END GP COOKIE BANNER */
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Promiň, stránku jsme nenašli.</p>
    <p>Možná byla přesunuta nebo smazána. Vrať se na hlavní stránku a pokračuj v procházení.</p>
    <a href="/">← Zpět na úvodní stránku</a>
    <p class="cookie-settings-wrap"><a class="gp-cookie-settings" href="#gp-cookie-banner">Nastavení cookies</a></p>
  </div>
  <!-- @include components/cookie-banner.html -->
</body>
</html>
