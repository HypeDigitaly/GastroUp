<!-- ============ CHECKOUT MODAL (FAPI předplatné) ============ -->
<div class="gp-modal" id="checkoutModal" role="dialog" aria-modal="true" aria-labelledby="coTitle" aria-hidden="true">
  <div class="gp-modal-card">
    <button class="gp-modal-close" id="coClose" type="button" aria-label="Zavřít objednávku">
      <iconify-icon icon="lucide:x"></iconify-icon>
    </button>
    <div class="gp-modal-head">
      <span class="gp-modal-eyebrow">Objednávka &middot; měsíční předplatné</span>
      <h3 id="coTitle">Tarif</h3>
      <p>Vyplň údaje níže a Parťák se ti hned ozve. <strong>Garance:</strong> za první měsíc budeš vědět, kde ti unikají peníze — pokud ne, zavoláme si a vyřešíme to.</p>
    </div>
    <div class="fapi-host" id="fapiHost"></div>
    <div class="fapi-fallback">
      Formulář se nenačetl? <a id="coFallback" href="https://form.fapi.cz/" target="_blank" rel="noopener">Otevři objednávku v novém okně →</a>
    </div>
  </div>
</div>
