<!-- ============ VIDEO ============ -->
<section class="section-video reveal" id="video">
  <!-- Scroll cue — bridges the hero into the video, replaces the old hero pill -->
  <a class="scroll-cue" href="#video" aria-label="Posunout na video">
    <span class="scroll-mouse"><span class="scroll-dot"></span></span>
    <span class="scroll-cue-label">Mrkni na video</span>
  </a>
  <div class="wrap">
    <div class="section-head">
      <h2>Takhle ti <em>Gastro Parťák</em> pomůže</h2>
    </div>
    <div class="video-frame">
      <iframe
        src="https://www.youtube.com/embed/3WdbP9qiSRc"
        title="GastroUp — Gastro Parťák (video)"
        loading="lazy"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen></iframe>
    </div>

    <!-- Post-video CTA — convert the moment of interest -->
    <div class="video-cta">
      <p class="video-cta-lead">Přesvědčil tě? <em>Vyzkoušej Parťáka</em> na vlastní podnik.</p>
      <div class="center-ctas">
        <!-- @include components/checkout-promo-cta.html class="btn btn-gold" -->
        <!-- @include components/cal-button.html class="btn btn-ghost" label="Demo zdarma" -->
      </div>
      <div class="video-cta-micro">Bez závazku &middot; Hotovo za 5 minut</div>
    </div>
  </div>
</section>
